<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yapay Zeka Gündemi</title>
<meta name="description" content="Yapay zeka dünyasında bugün ne oldu? Kısa özetler, hikâye akışı; istersen tamamını oku. Saatlik güncellenir.">
<meta property="og:title" content="Yapay Zeka Gündemi">
<meta property="og:description" content="Yapay zeka haberleri kısa özetlerle, saatlik güncellenir.">
<meta property="og:type" content="website">
<link rel="alternate" type="application/rss+xml" title="Yapay Zeka Gündemi" href="feed.xml">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%233D3BF3'/%3E%3Ccircle cx='11' cy='21' r='3' fill='white'/%3E%3Cpath d='M11 13a8 8 0 0 1 8 8M11 7a14 14 0 0 1 14 14' stroke='white' stroke-width='3' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --zemin:#E9EDF3; --kagit:#FFFFFF; --murekkep:#141A2B; --ikincil:#4D5670; --soluk:#7F88A0;
  --cizgi:#D5DBE6; --sinyal:#3D3BF3; --sinyal-yazi:#FFFFFF; --golge:0 1px 2px rgba(20,26,43,.06),0 12px 32px -16px rgba(20,26,43,.28);
  --k-model:#6E44FF; --k-arastirma:#00A389; --k-urun:#FF6B2C; --k-is:#E8336D; --k-politika:#B88A00; --k-donanim:#2D7FF9; --k-genel:#56607A;
  --baslik:"Bricolage Grotesque",system-ui,sans-serif; --govde:"Onest",system-ui,sans-serif;
  --yavas:cubic-bezier(.2,.7,.1,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --zemin:#0D1222; --kagit:#161C30; --murekkep:#E8ECF6; --ikincil:#A3ABC4; --soluk:#6E7894;
  --cizgi:#262E47; --sinyal:#8C8BFF; --sinyal-yazi:#0D1222; --golge:0 1px 2px rgba(0,0,0,.3),0 16px 40px -18px rgba(0,0,0,.7);
}}
:root[data-theme="dark"]{
  --zemin:#0D1222; --kagit:#161C30; --murekkep:#E8ECF6; --ikincil:#A3ABC4; --soluk:#6E7894;
  --cizgi:#262E47; --sinyal:#8C8BFF; --sinyal-yazi:#0D1222; --golge:0 1px 2px rgba(0,0,0,.3),0 16px 40px -18px rgba(0,0,0,.7);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--zemin);color:var(--murekkep);font:16px/1.6 var(--govde);overflow-x:hidden}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--sinyal);outline-offset:2px;border-radius:6px}
.kap{max-width:1200px;margin:0 auto;padding:0 16px}

/* üst çubuk */
.ust{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 0}
.marka{display:flex;align-items:center;gap:12px;text-decoration:none}
.marka svg{width:38px;height:38px;flex:none}
.marka b{display:block;font:800 21px/1 var(--baslik);letter-spacing:-.02em}
.marka small{display:block;color:var(--soluk);font-size:13px;margin-top:3px}
.ust-sag{display:flex;gap:8px}
.yuvarlak{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;min-width:38px;padding:0 12px;border-radius:999px;border:1px solid var(--cizgi);background:var(--kagit);cursor:pointer;text-decoration:none;font-size:14px;color:var(--ikincil)}
.yuvarlak:hover{color:var(--murekkep);border-color:var(--soluk)}
.yuvarlak svg{width:16px;height:16px}

/* hikâye sahnesi */
.sahne-alan{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:20px;padding:6px 0 28px}
.sahne{position:relative;border-radius:28px;overflow:hidden;min-height:520px;background:var(--renk,var(--k-genel));color:#fff;box-shadow:var(--golge);isolation:isolate;transition:background .6s var(--yavas)}
.sahne .foto{position:absolute;inset:0;z-index:-2;mix-blend-mode:multiply}
.sahne .foto img{width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.2) brightness(.95);transform:scale(1.06);animation:yakin 9s linear forwards}
@keyframes yakin{to{transform:scale(1)}}
.sahne .desen{position:absolute;inset:0;z-index:-2;opacity:.28;background:radial-gradient(circle,#fff 0 2px,transparent 3px) 0 0/28px 28px}
.sahne::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,transparent 30%,transparent 40%,rgba(0,0,0,.55) 100%)}
.ilerleme{position:absolute;top:16px;left:16px;right:16px;display:flex;gap:5px;z-index:2}
.ilerleme span{flex:1;height:4px;border-radius:4px;background:rgba(255,255,255,.35);overflow:hidden}
.ilerleme i{display:block;height:100%;width:0;background:#fff}
.ilerleme .bitti i{width:100%}
.sahne-ust{position:absolute;top:34px;left:20px;right:20px;display:flex;justify-content:space-between;align-items:center;font-size:14px;z-index:2}
.kaynak-rozet{display:inline-flex;align-items:center;gap:8px;font-weight:600}
.kaynak-rozet .harf{width:28px;height:28px;border-radius:50%;background:#fff;color:var(--renk);display:grid;place-items:center;font:800 13px var(--baslik)}
.kaynak-rozet span{opacity:.85;font-weight:400}
.durdur{background:rgba(255,255,255,.18);border:0;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(6px)}
.durdur svg{width:14px;height:14px}
.sahne-govde{position:absolute;left:0;right:0;bottom:0;padding:24px 28px 28px;z-index:2}
.kat-etiket{display:inline-block;background:#fff;color:var(--renk);font-weight:600;font-size:13px;padding:5px 11px;border-radius:999px;margin-bottom:14px}
.sahne h2{font:800 clamp(28px,3.6vw,46px)/1.02 var(--baslik);font-variation-settings:"wdth" 85;letter-spacing:-.025em;margin:0 0 14px;max-width:20ch;text-wrap:balance}
.sahne h2 .k{display:inline-block;opacity:0;transform:translateY(.5em) rotate(2deg);animation:kelime .55s var(--yavas) forwards;animation-delay:calc(var(--i) * 45ms + 120ms)}
@keyframes kelime{to{opacity:1;transform:none}}
.sahne p{margin:0 0 20px;max-width:52ch;font-size:17px;line-height:1.5;opacity:0;animation:belir .6s var(--yavas) forwards;animation-delay:var(--p-gecikme,.6s)}
@keyframes belir{from{opacity:0;transform:translateY(8px)}to{opacity:.95;transform:none}}
.ac-btn{display:inline-flex;align-items:center;gap:10px;background:#fff;color:#141A2B;border:0;border-radius:999px;padding:12px 20px;font-weight:600;cursor:pointer}
.ac-btn:hover{background:#f0f2ff}
.ac-btn svg{width:16px;height:16px}
.dokun{position:absolute;top:60px;bottom:140px;width:30%;z-index:1;cursor:pointer;background:none;border:0}
.dokun.sol{left:0}.dokun.sag{right:0}

.liste{background:var(--kagit);border-radius:28px;padding:22px 10px 12px;box-shadow:var(--golge);display:flex;flex-direction:column;min-width:0}
.liste h3{font:700 22px/1.1 var(--baslik);margin:0 12px 4px;letter-spacing:-.015em}
.liste .alt{color:var(--soluk);font-size:14px;margin:0 12px 12px}
.liste ol{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.liste li button{width:100%;text-align:left;display:grid;grid-template-columns:12px 1fr;gap:12px;align-items:start;padding:10px 12px;border:0;background:transparent;border-radius:14px;cursor:pointer;color:var(--ikincil);font-size:15px;line-height:1.35}
.liste li button:hover{background:var(--zemin);color:var(--murekkep)}
.liste li button[aria-current="true"]{background:color-mix(in srgb,var(--renk) 12%,transparent);color:var(--murekkep);font-weight:500}
.nokta{width:10px;height:10px;border-radius:50%;background:var(--renk);margin-top:6px}

/* filtreler */
.filtre{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--zemin) 90%,transparent);backdrop-filter:blur(12px);padding:12px 0}
.filtre .kap{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ara{flex:1 1 240px;display:flex;align-items:center;gap:10px;background:var(--kagit);border:1px solid var(--cizgi);border-radius:999px;padding:0 16px;min-width:0}
.ara:focus-within{border-color:var(--sinyal)}
.ara svg{width:17px;height:17px;color:var(--soluk);flex:none}
.ara input{border:0;outline:0;background:transparent;padding:11px 0;width:100%;min-width:0}
.secim{background:var(--kagit);border:1px solid var(--cizgi);border-radius:999px;padding:10px 14px;cursor:pointer}
.kats{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;width:100%}
.kats::-webkit-scrollbar{display:none}
.kat{flex:none;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--cizgi);background:var(--kagit);border-radius:999px;padding:7px 14px 7px 10px;cursor:pointer;font-size:14px;color:var(--ikincil)}
.kat:hover{color:var(--murekkep)}
.kat .nokta{margin:0}
.kat[aria-pressed="true"]{background:var(--renk,var(--murekkep));border-color:transparent;color:#fff}
.kat[aria-pressed="true"] .nokta{background:#fff}
.kat[data-k=""][aria-pressed="true"]{color:var(--zemin)}
.kat small{color:inherit;opacity:.6}

/* zaman çizelgesi */
.akis{padding:10px 0 40px}
.gun{display:grid;grid-template-columns:150px minmax(0,1fr);gap:20px;margin-top:26px}
.gun-ad{position:sticky;top:132px;align-self:start;font:700 26px/1 var(--baslik);letter-spacing:-.02em}
.gun-ad small{display:block;font:400 14px var(--govde);color:var(--soluk);margin-top:6px;letter-spacing:0}
.satirlar{display:flex;flex-direction:column;gap:10px}
.satir{display:grid;grid-template-columns:54px minmax(0,1fr) auto;gap:16px;align-items:start;background:var(--kagit);border-radius:20px;padding:16px 16px 16px 14px;cursor:pointer;border:1px solid transparent;text-align:left;width:100%;position:relative}
.satir:hover{border-color:var(--cizgi)}
.satir::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--renk)}
.saat{font:600 14px var(--baslik);color:var(--soluk);padding-top:3px;font-variant-numeric:tabular-nums}
.satir-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13.5px;color:var(--soluk);margin-bottom:4px}
.satir-meta .kat-yazi{color:var(--renk);font-weight:600}
.yeni{background:var(--sinyal);color:var(--sinyal-yazi);font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px}
.satir h4{font:700 20px/1.2 var(--baslik);letter-spacing:-.012em;margin:0 0 6px;overflow-wrap:anywhere;text-wrap:pretty}
.satir p{margin:0;color:var(--ikincil);font-size:15px;line-height:1.5;max-width:68ch}
.kucuk-foto{width:112px;height:84px;border-radius:14px;overflow:hidden;background:var(--renk);flex:none}
.kucuk-foto img{width:100%;height:100%;object-fit:cover;display:block}
.bos{background:var(--kagit);border-radius:20px;padding:40px 20px;text-align:center;color:var(--ikincil)}
.bos button{margin-top:12px}
.daha{display:block;margin:30px auto 0;background:var(--murekkep);color:var(--zemin);border:0;border-radius:999px;padding:13px 26px;font-weight:600;cursor:pointer}

/* okuma paneli */
.perde{position:fixed;inset:0;z-index:50;background:rgba(10,14,28,.45);opacity:0;pointer-events:none;transition:opacity .3s}
.perde.acik{opacity:1;pointer-events:auto}
.panel{position:fixed;z-index:51;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--kagit);box-shadow:var(--golge);transform:translateX(102%);transition:transform .42s var(--yavas);display:flex;flex-direction:column;overflow:hidden}
.panel.acik{transform:none}
.panel-kapak{position:relative;height:230px;flex:none;background:radial-gradient(circle,rgba(255,255,255,.28) 0 2px,transparent 3px) 0 0/28px 28px,var(--renk);overflow:hidden;isolation:isolate}
.panel-kapak img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:grayscale(1) contrast(1.15);mix-blend-mode:multiply;z-index:-1}
.panel-kapak .kapat{position:absolute;top:14px;right:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.9);color:#141A2B;cursor:pointer;display:grid;place-items:center}
.panel-kapak .kapat svg{width:18px;height:18px}
.panel-kapak .kat-etiket{position:absolute;left:24px;bottom:10px}
.panel-ic{overflow-y:auto;padding:22px 28px 32px;flex:1}
.panel h2{font:800 30px/1.08 var(--baslik);letter-spacing:-.02em;margin:4px 0 10px;font-variation-settings:"wdth" 90;text-wrap:balance}
.panel .bilgi{color:var(--soluk);font-size:14px;margin-bottom:20px}
.panel .ozet-kutu{background:var(--zemin);border-radius:16px;padding:14px 16px;margin-bottom:20px;font-size:16px}
.panel .ozet-kutu b{display:block;font:700 14px var(--baslik);color:var(--renk);margin-bottom:4px}
.panel .metin p{margin:0 0 14px;font-size:16.5px;line-height:1.7;max-width:62ch}
.panel .not{font-size:13.5px;color:var(--soluk);border-top:1px solid var(--cizgi);padding-top:14px;margin-top:6px}
.panel-alt{flex:none;display:flex;gap:8px;flex-wrap:wrap;padding:14px 28px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--cizgi);background:var(--kagit)}
.oku-btn{flex:1 1 100%;white-space:nowrap;display:inline-flex;justify-content:center;align-items:center;gap:8px;background:var(--sinyal);color:var(--sinyal-yazi);text-decoration:none;font-weight:600;border-radius:999px;padding:12px 18px}
.oku-btn svg{width:16px;height:16px}
.paylas-ikon{width:46px;height:46px;border-radius:50%;border:1px solid var(--cizgi);background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--ikincil);text-decoration:none}
.paylas-ikon:hover{color:var(--murekkep);border-color:var(--soluk)}
.paylas-ikon svg{width:18px;height:18px}

.bildirim{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);opacity:0;background:var(--murekkep);color:var(--zemin);padding:10px 18px;border-radius:999px;font-size:14px;transition:.25s;z-index:60;pointer-events:none}
.bildirim.acik{opacity:1;transform:translate(-50%,0)}
.taze{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;display:none;background:var(--sinyal);color:var(--sinyal-yazi);border:0;border-radius:999px;padding:10px 18px;font-weight:600;cursor:pointer;box-shadow:var(--golge)}
.taze.acik{display:block}

footer{padding:30px 0 50px;color:var(--soluk);font-size:14px;max-width:70ch}

@media (max-width:900px){
  .sahne-alan{grid-template-columns:1fr}
  .liste{display:none}
  .gun{grid-template-columns:1fr;gap:10px}
  .gun-ad{position:static}
}
@media (max-width:560px){
  .sahne{min-height:560px;border-radius:22px}
  .sahne-govde{padding:20px}
  .satir{grid-template-columns:minmax(0,1fr);padding:16px 16px 16px 18px}
  .saat{display:none}
  .kucuk-foto{display:none}
  .marka small{display:none}
  .panel{top:auto;height:92vh;border-radius:24px 24px 0 0;transform:translateY(102%)}
  .panel-kapak{height:170px}
  .panel-ic{padding:18px 20px 26px}
  .panel-alt{padding:12px 20px calc(12px + env(safe-area-inset-bottom))}
}
@media (prefers-reduced-motion:reduce){
  .sahne h2 .k,.sahne p{animation:none;opacity:1;transform:none}
  .sahne .foto img{animation:none;transform:none}
  .panel,.perde{transition:none}
}
</style>
</head>
<body>
<div class="kap">
  <header class="ust">
    <a class="marka" href="./">
      <svg viewBox="0 0 38 38" aria-hidden="true"><rect width="38" height="38" rx="11" fill="var(--sinyal)"/><circle cx="13" cy="25" r="3.4" fill="var(--sinyal-yazi)"/><path d="M13 16a9 9 0 0 1 9 9M13 9a16 16 0 0 1 16 16" stroke="var(--sinyal-yazi)" stroke-width="3.2" fill="none" stroke-linecap="round"/></svg>
      <span><b>Yapay Zeka Gündemi</b><small id="guncel">Saatlik güncellenir</small></span>
    </a>
    <div class="ust-sag">
      <a class="yuvarlak" href="feed.xml" title="RSS akışına abone ol" aria-label="RSS akışı"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="19" r="2.2"/><path d="M3 10.5v3a7.5 7.5 0 0 1 7.5 7.5h3A10.5 10.5 0 0 0 3 10.5Zm0-6v3A13.5 13.5 0 0 1 16.5 21h3A16.5 16.5 0 0 0 3 4.5Z"/></svg></a>
      <button class="yuvarlak" id="tema" aria-label="Açık ya da koyu tema"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg></button>
    </div>
  </header>

  <section class="sahne-alan" aria-label="Öne çıkan haberler">
    <div class="sahne" id="sahne" aria-roledescription="hikâye" aria-live="polite"></div>
    <aside class="liste">
      <h3>Şu an gündemde</h3>
      <p class="alt" id="liste-alt"></p>
      <ol id="hikaye-liste"></ol>
    </aside>
  </section>
</div>

<div class="filtre"><div class="kap">
  <label class="ara"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="ara" type="search" placeholder="Ara: Gemini, çip, dava, OpenAI…" autocomplete="off"></label>
  <select class="secim" id="kaynak" aria-label="Kaynak"></select>
  <div class="kats" id="kats" role="toolbar" aria-label="Kategoriler"></div>
</div></div>

<main class="kap akis" id="akis"></main>

<div class="kap"><footer>
  Haberler yayıncıların RSS akışlarından her saat otomatik derlenir. Başlık ve özetler ilgili yayıncılara aittir; tamamı için kaynağa gidin.
  <div id="kaynaklar" style="margin-top:8px"></div>
</footer></div>

<div class="perde" id="perde"></div>
<aside class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panel-baslik" hidden></aside>
<button class="taze" id="taze"></button>
<div class="bildirim" id="bildirim" role="status"></div>

<script src="haberler.js"></script>
<script>
(() => {
  const $ = s => document.querySelector(s);
  const SURE = 8000, SAYFA = 30;
  const AZ_HAREKET = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const RENK = { 'Model':'--k-model', 'Araştırma':'--k-arastirma', 'Ürün & Araç':'--k-urun', 'İş & Yatırım':'--k-is', 'Politika & Etik':'--k-politika', 'Donanım':'--k-donanim', 'Genel':'--k-genel' };
  const renk = k => `var(${RENK[k] || '--k-genel'})`;
  const I = {
    oku:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 6h10M4 12h16M4 18h12"/></svg>',
    dis:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M14 4h6v6M20 4 10 14M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></svg>',
    kapat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
    dur:'<svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>',
    oynat:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 4.5v15a1 1 0 0 0 1.5.9l12-7.5a1 1 0 0 0 0-1.8l-12-7.5A1 1 0 0 0 7 4.5Z"/></svg>',
    x:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.8 3h3.1l-6.8 7.7L22 21h-6.2l-4.9-6.4L5.3 21H2.2l7.3-8.3L1.8 3h6.4l4.4 5.8L17.8 3Zm-1.1 16.2h1.7L7.4 4.7H5.6l11.1 14.5Z"/></svg>',
    li:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4.98 3.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5ZM3 9.5h4V21H3V9.5Zm7 0h3.8v1.6h.1c.5-1 1.8-2 3.8-2 4 0 4.8 2.6 4.8 6V21h-4v-5.2c0-1.3 0-2.9-1.8-2.9s-2 1.4-2 2.8V21h-4V9.5Z"/></svg>',
    wa:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .2-1.3c-.1-.1-.3-.2-.5-.3Z"/></svg>',
    tg:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.9 4.3 18.7 19.4c-.2 1-.9 1.3-1.8.8l-4.8-3.6-2.3 2.2c-.3.3-.5.5-1 .5l.3-4.9 8.9-8c.4-.3-.1-.5-.6-.2l-11 6.9L1.6 11.6c-1-.3-1-1 .2-1.5L20.5 3c.9-.3 1.6.2 1.4 1.3Z"/></svg>',
    bag:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.7 1.7M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>'
  };

  const depo = {
    al(k){ try { return localStorage.getItem(k); } catch { return null; } },
    koy(k,v){ try { localStorage.setItem(k,v); } catch {} }
  };
  const temaUygula = t => { if (t) document.documentElement.dataset.theme = t; };
  temaUygula(depo.al('yz-tema'));
  $('#tema').onclick = () => {
    const koyu = document.documentElement.dataset.theme ? document.documentElement.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    const t = koyu ? 'light' : 'dark'; temaUygula(t); depo.koy('yz-tema', t);
  };

  let veri = window.HABERLER || { guncellendi:null, haberler:[] };
  const sonZiyaret = Number(depo.al('yz-son-ziyaret') || 0);
  depo.koy('yz-son-ziyaret', String(Date.now()));

  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const rtf = new Intl.RelativeTimeFormat('tr', { numeric:'auto' });
  function once(iso){
    const sn = (new Date(iso) - Date.now()) / 1000, a = Math.abs(sn);
    if (a < 60) return 'az önce';
    if (a < 3600) return rtf.format(Math.round(sn/60), 'minute');
    if (a < 86400) return rtf.format(Math.round(sn/3600), 'hour');
    return rtf.format(Math.round(sn/86400), 'day');
  }
  const saat = iso => new Date(iso).toLocaleTimeString('tr-TR', { hour:'2-digit', minute:'2-digit' });
  const norm = s => s.toLocaleLowerCase('tr').normalize('NFD').replace(/[̀-ͯ]/g,'');
  const kisa = h => h.ozet_tr || h.kisa || h.ozet || '';
  const yeniMi = h => sonZiyaret && new Date(h.tarih).getTime() > sonZiyaret;
  const foto = h => h.gorsel ? `<img src="${esc(h.gorsel)}" alt="" referrerpolicy="no-referrer" onerror="this.remove()">` : '';
  const bul = id => veri.haberler.find(h => h.id === id);

  /* ---------- hikâye oynatıcısı ---------- */
  let hikayeler = [], sira = 0, zaman = null, baslangic = 0, gecen = 0, durdu = AZ_HAREKET, kare = 0;

  function hikayeSec(){
    // son 48 saatten, her kaynaktan en fazla bir haber; görselliler önde
    const sinir = Date.now() - 48*3600e3, gorulen = new Set(), secim = [];
    const aday = veri.haberler.filter(h => new Date(h.tarih) >= sinir);
    for (const h of [...aday.filter(h => h.gorsel), ...aday.filter(h => !h.gorsel)]) {
      if (gorulen.has(h.kaynak)) continue;
      gorulen.add(h.kaynak); secim.push(h);
      if (secim.length === 8) break;
    }
    if (secim.length < 3) return veri.haberler.slice(0, 8);
    return secim.sort((a,b) => b.tarih.localeCompare(a.tarih));
  }

  function sahneCiz(){
    const h = hikayeler[sira]; if (!h) return;
    const s = $('#sahne');
    s.style.setProperty('--renk', renk(h.kategori));
    const kelimeler = h.baslik.split(/\s+/);
    s.innerHTML = `
      ${h.gorsel ? `<div class="foto">${foto(h)}</div>` : '<div class="desen"></div>'}
      <div class="ilerleme">${hikayeler.map((_, i) => `<span class="${i < sira ? 'bitti' : ''}"><i ${i === sira ? 'id="dolgu"' : ''}></i></span>`).join('')}</div>
      <div class="sahne-ust">
        <span class="kaynak-rozet"><span class="harf">${esc(h.kaynak[0])}</span>${esc(h.kaynak)} <span>${once(h.tarih)}</span></span>
        <button class="durdur" id="durdur" aria-label="${durdu ? 'Oynat' : 'Duraklat'}">${durdu ? I.oynat : I.dur}</button>
      </div>
      <button class="dokun sol" aria-label="Önceki haber"></button>
      <button class="dokun sag" aria-label="Sonraki haber"></button>
      <div class="sahne-govde">
        <span class="kat-etiket">${esc(h.kategori)}</span>
        <h2>${kelimeler.map((k, i) => `<span class="k" style="--i:${i}">${esc(k)}</span>`).join(' ')}</h2>
        <p style="--p-gecikme:${(kelimeler.length * 45 + 300) / 1000}s">${esc(kisa(h))}</p>
        <button class="ac-btn" data-ac="${h.id}">${I.oku}Haberi aç</button>
      </div>`;
    s.querySelector('.sol').onclick = () => git(sira - 1);
    s.querySelector('.sag').onclick = () => git(sira + 1);
    s.querySelector('#durdur').onclick = () => { durdu = !durdu; if (!durdu) baslangic = performance.now() - gecen; sahneUst(); };
    document.querySelectorAll('#hikaye-liste button').forEach((b, i) => b.setAttribute('aria-current', i === sira));
  }
  function sahneUst(){
    const b = $('#durdur'); if (!b) return;
    b.innerHTML = durdu ? I.oynat : I.dur; b.setAttribute('aria-label', durdu ? 'Oynat' : 'Duraklat');
  }
  function git(i){
    sira = (i + hikayeler.length) % hikayeler.length;
    gecen = 0; baslangic = performance.now();
    sahneCiz();
  }
  function dongu(t){
    const panelAcik = $('#panel').classList.contains('acik');
    if (durdu || panelAcik || document.hidden || sahneUzerinde) { baslangic = t - gecen; }
    else {
      gecen = t - baslangic;
      if (gecen >= SURE) { git(sira + 1); }
    }
    const d = $('#dolgu'); if (d) d.style.width = Math.min(100, gecen / SURE * 100) + '%';
    kare = requestAnimationFrame(dongu);
  }
  let sahneUzerinde = false;
  $('#sahne').addEventListener('pointerenter', e => { if (e.pointerType === 'mouse') sahneUzerinde = true; });
  $('#sahne').addEventListener('pointerleave', () => sahneUzerinde = false);
  $('#sahne').addEventListener('keydown', e => {
    if (e.key === 'ArrowRight') git(sira + 1);
    if (e.key === 'ArrowLeft') git(sira - 1);
  });

  function listeCiz(){
    $('#liste-alt').textContent = `Son 48 saatin ${hikayeler.length} öne çıkan haberi`;
    $('#hikaye-liste').innerHTML = hikayeler.map((h, i) =>
      `<li><button data-i="${i}" style="--renk:${renk(h.kategori)}"><span class="nokta"></span><span>${esc(h.baslik)}</span></button></li>`).join('');
    $('#hikaye-liste').onclick = e => { const b = e.target.closest('button'); if (b) git(Number(b.dataset.i)); };
  }

  /* ---------- akış ---------- */
  const durum = { q:'', kategori:'', kaynak:'', goster:SAYFA };

  function filtrele(){
    const q = norm(durum.q.trim());
    return veri.haberler.filter(h =>
      (!durum.kategori || h.kategori === durum.kategori) &&
      (!durum.kaynak || h.kaynak === durum.kaynak) &&
      (!q || norm(h.baslik + ' ' + kisa(h) + ' ' + h.kaynak).includes(q)));
  }
  function gunAdi(iso){
    const g = new Date(iso); g.setHours(0,0,0,0);
    const bugun = new Date(); bugun.setHours(0,0,0,0);
    const fark = Math.round((bugun - g) / 864e5);
    if (fark === 0) return ['Bugün', ''];
    if (fark === 1) return ['Dün', ''];
    if (fark < 7) return [g.toLocaleDateString('tr-TR', { weekday:'long' }), g.toLocaleDateString('tr-TR', { day:'numeric', month:'long' })];
    return [g.toLocaleDateString('tr-TR', { day:'numeric', month:'long' }), g.toLocaleDateString('tr-TR', { weekday:'long' })];
  }
  function akisCiz(){
    const liste = filtrele(), gosterilen = liste.slice(0, durum.goster);
    if (!liste.length) {
      $('#akis').innerHTML = `<div class="bos">Bu aramaya uyan haber yok. Filtreleri temizleyip tüm haberlere dönebilirsin.<br><button class="daha" id="temizle">Filtreleri temizle</button></div>`;
      $('#temizle').onclick = () => { durum.q = ''; durum.kategori = ''; durum.kaynak = ''; $('#ara').value = ''; filtreCiz(); akisCiz(); };
      return;
    }
    const gruplar = new Map();
    for (const h of gosterilen) {
      const [ad, alt] = gunAdi(h.tarih), k = ad + alt;
      if (!gruplar.has(k)) gruplar.set(k, { ad, alt, ogeler:[] });
      gruplar.get(k).ogeler.push(h);
    }
    $('#akis').innerHTML = [...gruplar.values()].map(g => `
      <section class="gun">
        <h3 class="gun-ad">${esc(g.ad)}<small>${g.alt ? esc(g.alt) + ', ' : ''}${g.ogeler.length} haber</small></h3>
        <div class="satirlar">${g.ogeler.map(h => `
          <button class="satir" data-ac="${h.id}" style="--renk:${renk(h.kategori)}">
            <span class="saat">${saat(h.tarih)}</span>
            <span>
              <span class="satir-meta"><span class="kat-yazi">${esc(h.kategori)}</span><span>${esc(h.kaynak)}</span>${h.tur === 'turkce' ? '<span>Türkçe</span>' : ''}${yeniMi(h) ? '<span class="yeni">Yeni</span>' : ''}</span>
              <h4>${esc(h.baslik)}</h4>
              ${kisa(h) ? `<p>${esc(kisa(h))}</p>` : ''}
            </span>
            ${h.gorsel ? `<span class="kucuk-foto">${foto(h).replace('<img', '<img loading="lazy"')}</span>` : '<span></span>'}
          </button>`).join('')}
        </div>
      </section>`).join('') + (liste.length > durum.goster ? `<button class="daha" id="daha">Daha fazla göster (${liste.length - durum.goster} haber kaldı)</button>` : '');
    const d = $('#daha'); if (d) d.onclick = () => { durum.goster += SAYFA; akisCiz(); };
  }
  function filtreCiz(){
    const sayi = {};
    veri.haberler.forEach(h => sayi[h.kategori] = (sayi[h.kategori] || 0) + 1);
    const kats = Object.entries(sayi).sort((a,b) => b[1] - a[1]);
    $('#kats').innerHTML = [['Tümü', veri.haberler.length, ''], ...kats.map(([k,n]) => [k, n, k])].map(([ad, n, k]) =>
      `<button class="kat" data-k="${esc(k)}" aria-pressed="${durum.kategori === k}" ${k ? `style="--renk:${renk(k)}"` : ''}>${k ? '<span class="nokta"></span>' : ''}${esc(ad)} <small>${n}</small></button>`).join('');
    const kaynaklar = [...new Set(veri.haberler.map(h => h.kaynak))].sort((a,b) => a.localeCompare(b,'tr'));
    $('#kaynak').innerHTML = '<option value="">Tüm kaynaklar</option>' + kaynaklar.map(k => `<option ${k === durum.kaynak ? 'selected' : ''}>${esc(k)}</option>`).join('');
    $('#kaynaklar').textContent = 'Kaynaklar: ' + kaynaklar.join(', ') + '.';
  }
  let bekle;
  $('#ara').addEventListener('input', e => { clearTimeout(bekle); bekle = setTimeout(() => { durum.q = e.target.value; durum.goster = SAYFA; akisCiz(); }, 140); });
  $('#kaynak').onchange = e => { durum.kaynak = e.target.value; durum.goster = SAYFA; akisCiz(); };
  $('#kats').onclick = e => {
    const b = e.target.closest('.kat'); if (!b) return;
    durum.kategori = b.dataset.k; durum.goster = SAYFA;
    document.querySelectorAll('.kat').forEach(c => c.setAttribute('aria-pressed', c === b));
    akisCiz();
  };

  /* ---------- okuma paneli ---------- */
  let oncekiOdak = null;
  function panelAc(h){
    oncekiOdak = document.activeElement;
    const p = $('#panel');
    const u = encodeURIComponent(h.link), m = encodeURIComponent(h.baslik + ' (' + h.kaynak + ')');
    const paragraflar = (h.detay && h.detay.length ? h.detay : [h.ozet]).filter(Boolean);
    const ozetFarkli = kisa(h) && (!paragraflar[0] || !paragraflar[0].startsWith(kisa(h).replace(/…$/, '').slice(0, 40)));
    p.style.setProperty('--renk', renk(h.kategori));
    p.innerHTML = `
      <div class="panel-kapak">${foto(h)}
        <button class="kapat" id="kapat" aria-label="Paneli kapat">${I.kapat}</button>
        <span class="kat-etiket">${esc(h.kategori)}</span>
      </div>
      <div class="panel-ic">
        <h2 id="panel-baslik">${esc(h.baslik)}</h2>
        <div class="bilgi">${esc(h.kaynak)}, ${once(h.tarih)} (${new Date(h.tarih).toLocaleString('tr-TR', { day:'numeric', month:'long', hour:'2-digit', minute:'2-digit' })})</div>
        ${h.ozet_tr ? `<div class="ozet-kutu"><b>Kısaca</b>${esc(h.ozet_tr)}</div>` : ozetFarkli ? `<div class="ozet-kutu"><b>Kısaca</b>${esc(kisa(h))}</div>` : ''}
        <div class="metin">${paragraflar.map(t => `<p>${esc(t)}</p>`).join('')}</div>
        <p class="not">Bu, ${esc(h.kaynak)} yayınından bir bölüm. Haberin tamamı yayıncının sitesinde.</p>
      </div>
      <div class="panel-alt">
        <a class="oku-btn" href="${esc(h.link)}" target="_blank" rel="noopener">${I.dis}${esc(h.kaynak)} sitesinde oku</a>
        <a class="paylas-ikon" href="https://x.com/intent/post?text=${m}&url=${u}" target="_blank" rel="noopener" aria-label="X'te paylaş">${I.x}</a>
        <a class="paylas-ikon" href="https://www.linkedin.com/sharing/share-offsite/?url=${u}" target="_blank" rel="noopener" aria-label="LinkedIn'de paylaş">${I.li}</a>
        <a class="paylas-ikon" href="https://wa.me/?text=${m}%20${u}" target="_blank" rel="noopener" aria-label="WhatsApp'ta paylaş">${I.wa}</a>
        <a class="paylas-ikon" href="https://t.me/share/url?url=${u}&text=${m}" target="_blank" rel="noopener" aria-label="Telegram'da paylaş">${I.tg}</a>
        <button class="paylas-ikon" id="kopya" aria-label="Bağlantıyı kopyala">${I.bag}</button>
      </div>`;
    p.hidden = false;
    p.offsetWidth; // geçişin çalışması için önce hidden kalkmış hali çizilsin
    p.classList.add('acik'); $('#perde').classList.add('acik');
    document.body.style.overflow = 'hidden';
    $('#kapat').onclick = panelKapat;
    $('#kopya').onclick = async () => {
      try { await navigator.clipboard.writeText(h.link); bildir('Bağlantı kopyalandı'); } catch { bildir('Bağlantı kopyalanamadı, adres çubuğundan kopyalayın'); }
    };
    setTimeout(() => $('#kapat').focus(), 50);
  }
  function panelKapat(){
    const p = $('#panel');
    p.classList.remove('acik'); $('#perde').classList.remove('acik');
    document.body.style.overflow = '';
    setTimeout(() => { if (!p.classList.contains('acik')) p.hidden = true; }, 450);
    if (oncekiOdak) oncekiOdak.focus();
  }
  $('#perde').onclick = panelKapat;
  addEventListener('keydown', e => { if (e.key === 'Escape' && $('#panel').classList.contains('acik')) panelKapat(); });
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-ac]'); if (!b) return;
    const h = bul(b.dataset.ac); if (h) panelAc(h);
  });
  function bildir(m){ const t = $('#bildirim'); t.textContent = m; t.classList.add('acik'); setTimeout(() => t.classList.remove('acik'), 2000); }

  /* ---------- başlat ---------- */
  function ustBilgi(){
    $('#guncel').textContent = veri.guncellendi ? `Son güncelleme ${once(veri.guncellendi)}` : 'Saatlik güncellenir';
  }
  function hepsi(){
    hikayeler = hikayeSec(); sira = 0; gecen = 0; baslangic = performance.now();
    listeCiz(); sahneCiz(); filtreCiz(); akisCiz(); ustBilgi();
  }
  hepsi();
  kare = requestAnimationFrame(dongu);
  setInterval(ustBilgi, 60e3);

  // yayındayken 10 dakikada bir yeni haber kontrolü
  if (location.protocol.startsWith('http')) {
    setInterval(async () => {
      try {
        const yeni = await (await fetch('haberler.json?t=' + Date.now(), { cache:'no-store' })).json();
        if (yeni.guncellendi === veri.guncellendi) return;
        const eski = new Set(veri.haberler.map(h => h.id));
        const fark = yeni.haberler.filter(h => !eski.has(h.id)).length;
        if (!fark) { veri = yeni; ustBilgi(); return; }
        const b = $('#taze');
        b.textContent = `${fark} yeni haber geldi, göster`;
        b.classList.add('acik');
        b.onclick = () => { veri = yeni; b.classList.remove('acik'); hepsi(); scrollTo({ top:0, behavior:'smooth' }); };
      } catch {}
    }, 10 * 60e3);
  }
})();
</script>
</body>
</html>
